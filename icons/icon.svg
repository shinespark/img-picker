<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- 山・太陽・カーソル周りの隙間は塗りではなく切り抜き。背景が透過なので、
         下地の色に依存せずライト・ダークどちらのツールバーでも成立する -->
    <mask id="cut">
      <rect width="128" height="128" fill="#fff"/>
      <path d="M 20 78 L 41 47 L 57 68 L 69 54 L 85 78 Z" fill="#000"/>
      <circle cx="74" cy="31" r="9" fill="#000"/>
      <g transform="translate(66 60) scale(1.45)">
        <path d="M0 0 L0 36 L9.6 27.4 L15.4 41 L23.4 37.6 L17.6 24.4 L30 23 Z"
              fill="#000" stroke="#000" stroke-width="9" stroke-linejoin="round"/>
      </g>
    </mask>
  </defs>

  <rect x="8" y="12" width="86" height="78" rx="14" fill="#3ab8a6" mask="url(#cut)"/>

  <g transform="translate(66 60) scale(1.45)">
    <path d="M0 0 L0 36 L9.6 27.4 L15.4 41 L23.4 37.6 L17.6 24.4 L30 23 Z" fill="#3ab8a6"/>
  </g>
</svg>
